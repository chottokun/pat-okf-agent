[project]
name = "okf-kb-agent"
version = "0.2.0"
description = "EPO/USPTO patent data access + OKF v0.2 Markdown knowledge base"
readme = "README.md"
authors = [{name = "Chottokun"}]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=5.0.0",
]

[project.scripts]
epo = "okf_kb_agent.epo:main"
uspto = "okf_kb_agent.uspto:main"
okf = "okf_kb_agent.wiki.cli:main"
okf-mcp = "okf_kb_agent.wiki.mcp_server:main"

[project.urls]
Repository = "https://github.com/chottokun/okf-kb-agent"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-downloads = "never"
